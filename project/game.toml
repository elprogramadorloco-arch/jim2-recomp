# Fast Boot (QoL, as in Bloody Roar II / SFA3): HLE boot-skip straight to the
# game EXE. Set false to play the authentic BIOS boot (and for verification).
bios_hle = true
# TCP debug server for live analysis (stall_report.py / debug_client.py).
debug_port = 4370
# SLES_003.43 is only a loader; MENU / L1..L10 / END are separate PS-X EXEs
# loaded at 0x80020000 (native via aot/overlays.json). Keep capturing anything
# else streamed into RAM so tools/compile_overlays.py can turn it native.
overlay_cache = true
overlay_capture_history = true
overlay_capture_persist_dir = "build-release"

[video]
renderer = "opengl"
aspect_ratio = "4:3"

# 16:9 widescreen is owned by the ewj2.enhancement.widescreen mod. full_2d
# marks EWJ2 as a pure 2D sprite game for the native-wide present path; it is
# inert at 4:3.
[widescreen]
full_2d = true
offer = false

[controller]
default_mode = "digital"

